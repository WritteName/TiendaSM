<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TiendaSM</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Distribuidora Don Pepe</h1>
      <nav class="nav-modules">
        <a href="index.html" class="nav-link active">Módulo de Ventas</a>
        <a href="productos.html" class="nav-link">Módulo de Productos</a>
      </nav>
    </header>
    <main class="main">
      <section class="card form-section">
        <h2>Registrar venta</h2>
        <form id="formVenta" class="form">
          <div class="form-row">
            <label for="producto">Producto</label>
            <select id="producto" name="NomProducto" required></select>
          </div>
          <div class="form-row">
            <label for="vendedor">Vendedor</label>
            <select id="vendedor" name="NombreVendedor" required></select>
          </div>
          <div class="form-row two-cols">
            <div>
              <label for="precio">Precio</label>
              <input type="number" id="precio" name="Precio" step="0.01" min="0" required>
            </div>
            <div>
              <label for="kilos">Kilos</label>
              <input type="number" id="kilos" name="Kilos" min="1" required>
            </div>
          </div>
          <div class="form-row">
            <label for="kilos">Fecha</label>
            <input type="datetime-local" id="fecha" name="FechaAlta">
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Registrar venta</button>
            <button type="reset" class="btn btn-secondary">Limpiar</button>
          </div>
        </form>
        <p id="formMessage" class="message" aria-live="polite"></p>
      </section>

      <section class="card resumen-section">
        <h2>Monto de venta por vendedor</h2>
        <div id="resumenVendedores" class="resumen-list"></div>
      </section>

      <section class="card list-section">
        <h2>Registro de ventas</h2>
        <div class="toolbar">
          <button type="button" id="btnRefrescar" class="btn btn-outline">Actualizar lista</button>
        </div>
        <div id="loadingVentas" class="loading">Cargando ventas…</div>
        <div id="errorVentas" class="error" hidden></div>
        <table id="tablaVentas" class="table" hidden>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Producto</th>
              <th>Precio</th>
              <th>Kilos</th>
              <th>Monto</th>
              <th>Vendedor</th>
            </tr>
          </thead>
          <tbody id="tbodyVentas"></tbody>
        </table>
      </section>
    </main>

    <footer class="footer">
      <p>@Derechos Reservados Don Pepe</p>
    </footer>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
