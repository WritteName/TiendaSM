<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TiendaSM</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Distribuidora Don Pepe</h1>
      <nav class="nav-modules">
        <a href="index.html" class="nav-link">Módulo de Ventas</a>
        <a href="productos.html" class="nav-link active">Módulo de Productos</a>
      </nav>
    </header>
    <main class="main">
      <section class="card form-section">
        <h2>Registrar Producto</h2>
        <form id="formProducto" class="form">
          <div class="form-row">
            <label for="nombreProducto">Nombre</label>
            <input type="text" id="nombreProducto" name="nombre">
          </div>
          <div class="form-row">
            <label for="grupo">Grupo</label>
            <select id="grupo" name="grupoID" required>
              <option value="">Seleccione grupo</option>
            </select>
          </div>
          <div class="form-row two-cols">
            <div>
              <label for="precioUnitario">Precio unitario</label>
              <input type="number" id="precioUnitario" name="PrecioUnitario" step="0.01" min="0.01" required placeholder="0.00">
            </div>
            <div>
              <label for="kilos">Kilos disponibles</label>
              <input type="number" id="kilos" name="Kilos" min="0" required placeholder="0">
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Registrar</button>
            <button type="reset" class="btn btn-secondary">Limpiar</button>
          </div>
        </form>
        <p id="formMessage" class="message" aria-live="polite"></p>
      </section>

      <section class="card list-section">
        <h2>Consultar Producto</h2>
        <div class="toolbar consulta-toolbar">
          <div class="busqueda-row">
            <label for="buscarNombre">Buscar por nombre</label>
            <div class="busqueda-input">
              <input type="text" id="buscarNombre" placeholder="Ingrese nombre del producto">
              <button type="button" id="btnBuscar" class="btn btn-primary">Buscar</button>
              <button type="button" id="btnVerTodos" class="btn btn-outline">Ver todos</button>
            </div>
          </div>
        </div>
        <p id="busquedaMessage" class="message" aria-live="polite"></p>
        <div id="loadingProductos" class="loading">Cargando productos…</div>
        <div id="errorProductos" class="error" hidden></div>
        <table id="tablaProductos" class="table" hidden>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Grupo</th>
              <th>Precio unitario</th>
              <th>Stock (kilos)</th>
            </tr>
          </thead>
          <tbody id="tbodyProductos"></tbody>
        </table>
      </section>
    </main>

    <footer class="footer">
      <p>@Derechos Reservados Don Pepe</p>
    </footer>
  </div>
  <script src="js/productos.js"></script>
</body>
</html>
